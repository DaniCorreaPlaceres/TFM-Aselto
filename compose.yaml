services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://aselto:aselto@database:3306/aselto?serverVersion=8.4&charset=utf8mb4
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:8080/.well-known/mercure
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
      DEFAULT_URI: http://localhost:8080
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_cache:/var/www/html/var/cache
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  styles:
    build: .
    restart: unless-stopped
    user: www-data
    entrypoint: ["sh", "/var/www/html/docker/php/styles.sh"]
    environment:
      APP_ENV: dev
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_cache:/var/www/html/var/cache
    depends_on:
      app:
        condition: service_started

  quarter_updates:
    build: .
    restart: unless-stopped
    user: www-data
    entrypoint: ["php", "bin/console", "app:quarter-updates:publish", "--watch", "--no-debug"]
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://aselto:aselto@database:3306/aselto?serverVersion=8.4&charset=utf8mb4
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:8080/.well-known/mercure
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_cache:/var/www/html/var/cache
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_started
      mercure:
        condition: service_started

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aselto
      MYSQL_USER: aselto
      MYSQL_PASSWORD: aselto
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  mercure:
    image: dunglas/mercure@sha256:27845c71dd26878bfb77bb0723fd3ea26e55d07ad0025b1c0948533ac30a5afc
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_EXTRA_DIRECTIVES: |
        cookie_name mercure_access_token
        resource_identifier http://localhost:8080/.well-known/mercure
        anonymous
        cors_origins http://localhost:8080 http://127.0.0.1:8080
    ports:
      - "9080:80"

volumes:
  database_data:
  app_vendor:
  app_cache:
