framework:
    lock: 'flock'
    cache:
        pools:
            cache.authentication_limits:
                adapter: cache.adapter.filesystem
    rate_limiter:
        authentication_ip:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            cache_pool: cache.authentication_limits
        authentication_identity:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
            cache_pool: cache.authentication_limits
        recovery_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            cache_pool: cache.authentication_limits
        recovery_identity:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
            cache_pool: cache.authentication_limits
