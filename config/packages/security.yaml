security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        identity:
            id: App\Identidad\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: identity
            form_login:
                login_path: /entrar
                check_path: /entrar
                default_target_path: /cuenta
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: /salir
                target: /entrar

    access_control:
        - { path: ^/salud, roles: PUBLIC_ACCESS }
        - { path: ^/entrar, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/asesorias, roles: ROLE_SUPERADMIN }
        - { path: ^/equipo, roles: ROLE_FIRM_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
