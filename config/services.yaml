# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(OPENAI_API_KEY): ''
    env(OPENAI_MODEL): 'gpt-4o-mini'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Shared/Domain/'
            - '../src/Identidad/Domain/'
            - '../src/Asesoria/Domain/'
            - '../src/Cliente/Domain/'
            - '../src/Documento/Domain/'
            - '../src/Finanzas/Domain/'
            - '../src/Comunicacion/Domain/'
            - '../src/Identidad/Infrastructure/Persistence/DoctrineUser.php'
            - '../src/Identidad/Infrastructure/Persistence/DoctrineAccessToken.php'
            - '../src/Asesoria/Infrastructure/Persistence/DoctrineFirm.php'
            - '../src/Cliente/Infrastructure/Persistence/DoctrineClient.php'
            - '../src/Documento/Infrastructure/Persistence/DoctrineDocument.php'
            - '../src/Finanzas/Infrastructure/Persistence/DoctrineQuarter.php'
            - '../src/Comunicacion/Infrastructure/Persistence/DoctrineConversation.php'

    App\Identidad\Domain\UserRepository:
        alias: App\Identidad\Infrastructure\Persistence\DoctrineUserRepository

    App\Identidad\Domain\PasswordHasher:
        alias: App\Identidad\Infrastructure\Security\SymfonyPasswordHasher

    App\Identidad\Domain\AccessTokenRepository:
        alias: App\Identidad\Infrastructure\Persistence\DoctrineAccessTokenRepository

    App\Identidad\Domain\AccountNotifier:
        alias: App\Identidad\Infrastructure\Mail\SymfonyAccountNotifier

    App\Identidad\Domain\TokenGenerator:
        alias: App\Identidad\Infrastructure\Security\RandomTokenGenerator

    App\Asesoria\Domain\FirmRepository:
        alias: App\Asesoria\Infrastructure\Persistence\DoctrineFirmRepository

    App\Cliente\Domain\ClientRepository:
        alias: App\Cliente\Infrastructure\Persistence\DoctrineClientRepository

    App\Documento\Domain\DocumentRepository:
        alias: App\Documento\Infrastructure\Persistence\DoctrineDocumentRepository

    App\Documento\Domain\DocumentFileStore:
        alias: App\Documento\Infrastructure\Storage\LocalDocumentFileStore

    App\Documento\Domain\DocumentExtractor:
        alias: App\Documento\Infrastructure\Extraction\ConfiguredDocumentExtractor

    App\Shared\Domain\IdGenerator:
        alias: App\Shared\Infrastructure\SymfonyIdGenerator

    App\Shared\Domain\Clock:
        alias: App\Shared\Infrastructure\SystemClock

    App\Shared\Domain\Transaction:
        alias: App\Shared\Infrastructure\DoctrineTransaction

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Shared\Domain\ClientTransaction:
        alias: App\Shared\Infrastructure\DoctrineClientTransaction

    App\Shared\Domain\ClosedPeriodGuard:
        alias: App\Finanzas\Application\PreventClosedQuarterChanges

    App\Finanzas\Domain\QuarterRepository:
        alias: App\Finanzas\Infrastructure\Persistence\DoctrineQuarterRepository

    App\Finanzas\Domain\FinancialRecords:
        alias: App\Finanzas\Infrastructure\Persistence\DoctrineFinancialRecords

    App\Comunicacion\Domain\ConversationRepository:
        alias: App\Comunicacion\Infrastructure\Persistence\DoctrineConversationRepository

    App\Comunicacion\Domain\AttachmentStore:
        alias: App\Comunicacion\Infrastructure\Storage\LocalAttachmentStore
