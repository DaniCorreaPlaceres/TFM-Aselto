openapi: 3.0.3
info:
  title: Aselto API
  version: 0.5.0
  description: 'API v1: acceso JWT, identidad, documentos, revisión, trimestres y comunicación. Reutiliza los casos de uso de la web. Importes calculados en céntimos; conversaciones y adjuntos privados con permisos de la asesoría actual.'
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 'Obtener un token de acceso'
      description: "Usa el mismo proveedor de usuarios y la misma comprobación de activación que la web. Un correo inexistente, una cuenta inactiva y una contraseña incorrecta producen el mismo error. La contraseña no se recorta.\n"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: cliente@example.test
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 4096
                  writeOnly: true
      responses:
        '200':
          description: 'Acceso correcto. La respuesta no se almacena en caché.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - token
                  - token_type
                  - expires_in
                properties:
                  token:
                    type: string
                    description: 'JWT firmado. No debe incluirse en URLs ni registros.'
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    enum:
                      - 3600
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: 'Correo o contraseña incorrectos, o cuenta inactiva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: 'El correo o la contraseña no son correctos.'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: 'El cuerpo supera los 16 KiB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'Se requiere Content-Type application/json.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: currentUser
      summary: 'Consultar la identidad actual'
      description: "Recarga el usuario de la base de datos para comprobar activación, papel y asesoría actuales. No permite elegir otro usuario ni devuelve datos fiscales.\n"
      security:
        -
          bearerAuth: {  }
      responses:
        '200':
          description: 'Identidad del usuario autenticado, sin caché.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 'Token ausente, inválido o caducado, o cuenta no disponible.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Operación no permitida para el usuario.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/documents:
    get:
