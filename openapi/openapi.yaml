components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: array
              items:
                type: string
              description: 'Campos de la API que faltan para confirmar o validar, cuando corresponde.'
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - firm_id
        - activated
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - superadmin
            - firm_admin
            - advisor
            - client
        firm_id:
          type: string
          format: uuid
          nullable: true
        activated:
          type: boolean
          enum:
            - true
    DocumentDetails:
