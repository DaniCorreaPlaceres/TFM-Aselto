          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        unread:
          type: integer
          minimum: 0
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConversationMessage'
  responses:
    InvalidRequest:
      description: 'JSON mal formado o campos ausentes, incorrectos o no admitidos.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 'Método no permitido.'
      headers:
        Allow:
          description: 'Métodos admitidos en esta ruta.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 'Error interno genérico, sin trazas ni detalles técnicos.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentNotFound:
      description: 'Documento o archivo inexistente o no visible para este usuario.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentConflict:
      description: 'Versión obsoleta, trimestre cerrado o cuota mensual agotada (document_quota_exceeded al subir). Consultar de nuevo antes de modificar; para la cuota, esperar al siguiente mes o solicitar cambio manual de plan.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentValidation:
      description: 'Datos incompletos o incompatibles, estado no editable, motivo ausente o archivo no admitido. Los campos obligatorios ausentes se indican en error.fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentForbidden:
      description: 'Papel no autorizado en esta ruta.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentUnauthorized:
      description: 'Se requiere un JWT Bearer válido.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentTooLarge:
      description: 'El archivo supera los 8 MB o el cuerpo JSON supera los 32 KiB.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentMediaType:
      description: 'Usar application/json para cambios y multipart/form-data para subidas.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
