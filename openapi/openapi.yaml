  /api/v1/conversation-recipients:
    get:
      tags:
        - Comunicación
      operationId: conversationRecipients
      summary: 'Consultar destinatarios permitidos'
      description: 'Cliente vinculado y admin/gestor de su asesoría actual. El superadmin no tiene acceso. Datos privados sin caché. Destinatarios usa owner_id (usuario del cliente); client_id identifica el perfil. Listar no marca lectura; GET del detalle registra solo la secuencia mostrada y devuelve unread=0 para esa secuencia. Responder no marca mensajes ajenos como leídos ni resuelve solicitudes. Solo el equipo crea solicitudes y confirma su resolución. Escrituras serializadas por cliente, sin exigir ni exponer versiones al consumidor. Los adjuntos generales no se incorporan a las cifras fiscales.'
      security:
        -
          bearerAuth: {  }
      responses:
        200:
          description: 'Operación completada, sin caché.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - recipients
                properties:
                  recipients:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - client_id
                        - owner_id
                        - name
                      properties:
                        client_id:
                          type: string
                          format: uuid
                        owner_id:
                          type: string
                          format: uuid
                        name:
                          type: string
        400:
          description: 'Entrada inválida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: 'Token ausente, inválido o caducado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Papel no permitido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'conversation_not_found: conversación, destinatario o adjunto no accesible.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        405:
          description: 'Método no permitido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: 'Error interno sin detalles.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
