        '403':
          $ref: '#/components/responses/DocumentForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: uploadDocument
      summary: 'Subir un documento para revisión humana'
      description: 'Cada registro creado consume una unidad del mes natural en Atlantic/Canary. Gratis permite 20; Profesional independiente o cobertura Asesoría no tienen límite mensual. Los límites de archivo se mantienen. Corregir o aportar justificantes no consume otra unidad; borrar no devuelve cuota. Al agotar Gratis responde 409 con error.code document_quota_exceeded, sin crear registro ni consumir otra unidad.'
      security:
        -
          bearerAuth: {  }
      responses:
        '201':
          description: 'Registro persistido con la versión actual. No se cachea.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          headers:
            Location:
              description: 'URL protegida de la ficha creada.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/DocumentUnauthorized'
        '403':
          $ref: '#/components/responses/DocumentForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/DocumentConflict'
        '413':
          $ref: '#/components/responses/DocumentTooLarge'
        '415':
          $ref: '#/components/responses/DocumentMediaType'
        '422':
          $ref: '#/components/responses/DocumentValidation'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'PDF, JPEG, PNG o WebP de hasta 8.000.000 bytes.'
