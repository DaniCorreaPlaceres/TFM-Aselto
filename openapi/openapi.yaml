          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: string
          minLength: 1
          maxLength: 4000
        request:
          type: boolean
          default: false
        document_id:
          type: string
          format: uuid
          nullable: true
    ConversationCreateUpload:
      type: object
      additionalProperties: false
      required:
        - owner_id
        - subject
        - text
      properties:
        owner_id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: string
          minLength: 1
          maxLength: 4000
        request:
          type: boolean
          default: false
        document_id:
          type: string
          format: uuid
          nullable: true
        'attachments[]':
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
          description: 'Hasta tres archivos PDF/JPEG/PNG/WebP, máximo 8000000 bytes cada uno. El campo multipart se llama attachments[].'
    ConversationReply:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    ConversationReplyUpload:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        'attachments[]':
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
          description: 'Hasta tres archivos PDF/JPEG/PNG/WebP, máximo 8000000 bytes cada uno. El campo multipart se llama attachments[].'
