name: Comprobaciones

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHP-Stan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/phpunit
      - run: php bin/console importmap:install --env=test
      - run: php bin/console sass:build --env=test
      - run: php bin/console asset-map:compile --env=test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/Frontend/live-quarter.test.mjs
      - run: node --test tests/Frontend/table-export.test.mjs
      - run: node --test tests/Frontend/document-upload.test.mjs

  schema:
    name: Esquema MySQL
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aselto_test
          MYSQL_USER: aselto
          MYSQL_PASSWORD: aselto
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://aselto:aselto@127.0.0.1:3306/aselto?serverVersion=8.4&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console doctrine:schema:validate
      - run: php tests/Integration/schema-workflow.php

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php bin/validate-openapi.php
