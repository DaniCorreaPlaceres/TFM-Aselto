name: Comprobaciones

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  production-package:
    name: Paquete y despliegue
    needs: [php-cs-fixer, phpstan, phpunit, schema, openapi, security-integration]
    permissions:
      contents: read
    uses: ./.github/workflows/publicacion-hostinger.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true' }}
    secrets: inherit

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHP-Stan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/phpunit
      - run: php tests/Integration/deployment-package-workflow.php
      - run: php bin/console importmap:install --env=test
      - run: php bin/console sass:build --env=test
      - run: php bin/console asset-map:compile --env=test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/Frontend/live-quarter.test.mjs
      - run: node --test tests/Frontend/table-export.test.mjs
      - run: node --test tests/Frontend/document-upload.test.mjs
      - run: node --test tests/Frontend/section-navigation.test.mjs
      - run: node --test tests/Frontend/document-exemption.test.mjs

  schema:
    name: Esquema MySQL
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aselto_test
          MYSQL_USER: aselto
          MYSQL_PASSWORD: aselto
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://aselto:aselto@127.0.0.1:3306/aselto?serverVersion=8.4&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php tests/Integration/license-backfill-workflow.php
      - run: php bin/console doctrine:schema:validate
      - run: php tests/Integration/schema-workflow.php
      - run: php tests/Integration/licenses-workflow.php

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php bin/validate-openapi.php

  security-integration:
    name: Seguridad web y API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aselto_security_ci
          MYSQL_USER: aselto
          MYSQL_PASSWORD: aselto
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: dev
      APP_DEBUG: '0'
      APP_SECRET: synthetic-security-ci-secret
      DATABASE_URL: 'mysql://aselto:aselto@127.0.0.1:3306/aselto_security_ci?serverVersion=8.4&charset=utf8mb4'
      SECURITY_CHECKS_DISPOSABLE: '1'
      MAILER_DSN: 'null://null'
      OPENAI_API_KEY: ''
      SECURITY_ALERT_EMAIL_ENABLED: '0'
      JWT_PASSPHRASE: synthetic-security-ci-passphrase
      MERCURE_URL: 'http://127.0.0.1:1/.well-known/mercure'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring, zip, bcmath, dom, xml, openssl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Preparar recursos y claves efímeras
        run: |
          php bin/console lexik:jwt:generate-keypair
          php bin/console importmap:install
          php bin/console sass:build
      - name: Preparar base desechable
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
      - name: Ejecutar regresiones de seguridad
        run: php bin/check-security.php
